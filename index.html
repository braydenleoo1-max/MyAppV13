<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}

.aur i:nth-child(3){background:var(--g2);top:35%;left:25%;width:40vmax;height:40vmax;animation-delay:-12s;opacity:.22}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.flow{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 7s linear infinite}

.card{padding:16px}

.aur i{will-change:transform}

.pill.run{color:#eafff7;background:linear-gradient(135deg,rgba(125,255,212,.3),rgba(125,255,212,.08));border-color:rgba(125,255,212,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 18px -4px rgba(125,255,212,.55)}
.pill.run u{box-shadow:0 0 10px #7dffd4}
.pill.run u::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid #7dffd4;animation:ring 1.8s ease-out infinite}
.pill.off{color:#fff0cc;background:linear-gradient(135deg,rgba(255,210,125,.3),rgba(255,210,125,.08));border-color:rgba(255,210,125,.5)}
.pill.off u{width:10px;height:11px;border-radius:2px;background:linear-gradient(90deg,#ffd27d 0 36%,transparent 36% 64%,#ffd27d 64%);animation:soft 2.4s ease-in-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
@keyframes soft{50%{opacity:.45}}
@keyframes beat{50%{transform:scale(1.8);opacity:.5}}
.ringw{position:relative;width:min(70vw,260px);margin:14px auto 6px;aspect-ratio:1}
.ringw svg{width:100%;height:100%;display:block}
#rg{transition:stroke-dashoffset .5s ease}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:clamp(36px,11vw,48px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}

input{width:100%;font:inherit;padding:12px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;text-align:center;outline:0}

.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}
button{font:inherit;cursor:pointer;color:inherit}

.bigbtn{position:relative;width:118px;height:118px;border-radius:50%;border:0;background:#fff;color:#1b2566;font-size:17px;font-weight:800;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .15s}

@keyframes ping{to{transform:scale(1.35);opacity:0}}
.sm{width:66px;height:66px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sm svg{width:22px;height:22px}
.sp{width:66px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}

.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;padding:12px 12px 13px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 4%,transparent) 72%),var(--card);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 18px rgba(255,255,255,.05),0 12px 26px -16px color-mix(in srgb,var(--c) 80%,transparent)}
.tile::after{content:"";position:absolute;left:-28%;top:-50%;width:90%;height:90%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 34%,transparent),transparent);pointer-events:none}
.tile>*{position:relative;z-index:1}
.ti{display:grid;place-items:center;width:28px;height:28px;margin-bottom:10px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ti svg{width:16px;height:16px}
.tile b{max-width:100%;font-size:clamp(14px,4.6vw,19px);font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{max-width:100%;margin-top:3px;color:var(--mut);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{width:100%;height:4px;margin-top:10px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,transparent)}
.tm u{display:block;height:100%;width:var(--w,0%);border-radius:3px;text-decoration:none;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lastc{display:grid;grid-template-columns:1fr auto;align-items:center}
.lastc .bar{grid-column:1/-1}
.bar{height:8px;border-radius:4px;background:var(--potbg);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--g2),var(--g1));transition:width .5s}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top .key{margin-left:auto;color:var(--mut);font-size:12px}
.key b{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 8px}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700}
.tod{height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.seg{display:inline-flex;padding:3px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--tx);color:var(--bg)}
.zoom{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.zoom .round{width:34px;height:34px;font-size:20px;line-height:1;padding:0}
.zoom output{flex:1;text-align:center;font-weight:600;font-size:12.5px;color:var(--mut)}
.wrap{border-radius:26px;overflow:hidden;background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.row{display:grid;grid-template-columns:46px repeat(var(--n,7),1fr)}
.head button{margin:0;border:0;border-left:1px solid var(--line);background:none;padding:10px 2px;font-weight:600;font-size:13px;line-height:1.3}
.head button.sel{background:var(--potbg)}
.head small{display:block;color:var(--mut);font-weight:500}
#cb{height:min(58vh,560px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;border-top:1px solid var(--line);scrollbar-width:none}
.col{position:relative;border-left:1px solid var(--line)}
.hrs{position:relative}
.hrs span{position:absolute;right:5px;font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.pb{position:absolute;left:0;right:0;background:var(--potbg)}
.b{position:absolute;left:12%;right:6%;min-height:3px;background:linear-gradient(180deg,var(--g2),var(--g1));border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:2px 6px;overflow:hidden;white-space:nowrap}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.hero2{padding:14px 16px}
.hero2 b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero2 span{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.sh{display:flex;justify-content:space-between;margin:0 4px 8px;font-size:13px;font-weight:700;color:var(--mut)}
.ent{position:relative;padding:14px 16px;margin-bottom:10px}
.ent .nm{font-weight:700;padding-right:34px}
.ent .tt{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.ent .r1{display:flex;align-items:baseline;gap:8px}
.ent .r1 b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ent .r1 span{color:var(--mut);font-size:13px}
.ent .ef{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:8px}
.ent .ef b{color:var(--tx)}
.ent button{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--potbg);color:var(--mut)}
.empty{color:var(--mut)}
.note{color:var(--mut);font-size:13px;margin:18px 4px 0}
.glass,.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 18px rgba(255,255,255,.06)}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,360px);display:flex;padding:5px;border-radius:99px;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1.5px 0 rgba(255,255,255,.15),inset 0 0 22px rgba(255,255,255,.14),0 18px 40px -12px rgba(20,24,60,.38)}
.thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:99px;translate:calc(var(--p,0)*100%) 0;scale:var(--s,1);will-change:translate,scale;transition:scale .2s cubic-bezier(.3,.9,.4,1);background:linear-gradient(165deg,rgba(255,255,255,.62),rgba(255,255,255,.16));-webkit-backdrop-filter:blur(8px) saturate(2);backdrop-filter:blur(8px) saturate(2);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -2px 8px rgba(91,108,255,.28),0 6px 16px rgba(30,40,100,.22)}
.nav button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;font-weight:700}
.nav button.on{color:var(--tx)}
.nav svg{width:22px;height:22px}
/* brain: emoji-style side view. --v (life) and --rot (decay) come from % of potential used and drive every colour, spot and glow */
.brainw{position:relative;width:min(66vw,252px);aspect-ratio:404/340;margin:14px auto 8px;cursor:pointer}
.brainw svg{position:relative;display:block;width:100%;height:100%;overflow:visible;will-change:transform}
#bn{position:absolute;left:0;top:0;pointer-events:none}
.brainw,.mb{--v:.3;--rot:0;--web:0;--pk:0}
.brainw .glow{position:absolute;inset:-18% -12%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(var(--gl),.62),rgba(var(--gl),.2) 58%,transparent 78%);opacity:0;transition:opacity 1s linear}
.brainw.run .glow{opacity:calc((.1 + var(--v)*.62)*max(0,1 - var(--pk)*40))}
.brainw.off .glow{opacity:calc(var(--v)*.3*max(0,1 - var(--pk)*40))}
#bs{filter:brightness(calc(1 + var(--pk)*.06)) saturate(calc(1 + var(--pk)*.2));transition:filter 1s linear}
.b1{stop-color:rgb(var(--b1))}.b2{stop-color:rgb(var(--b2))}.b3{stop-color:rgb(var(--b3))}
.k1{stop-color:rgb(var(--k1))}.k2{stop-color:rgb(var(--k2))}.k3{stop-color:rgb(var(--k3))}
.b1,.b2,.b3,.k1,.k2,.k3{transition:stop-color 1s linear}
.gs,.gc,.gh,.ed,.cl{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke 1s linear}
.gs{stroke:rgb(var(--gv));opacity:.4}.gc{stroke:rgb(var(--gv));opacity:.6}
.gh{stroke:rgb(var(--gh));opacity:.5}.ed{stroke:rgb(var(--ed))}.cl{stroke:rgb(var(--gv));opacity:.3}
.hl{opacity:calc(.85 - var(--rot)*.85)}
.bm{transform-box:view-box;transform-origin:50% 93%;transform:translateY(calc(var(--rot)*5px)) scaleY(calc(1 - var(--rot)*.06));transition:transform 1s linear}
.mo{--mo0:clamp(0,calc((var(--rot) - .14 - var(--t)*.75)*3.4),1);opacity:var(--mo0);transition:opacity 1s linear}
.web{fill:none;stroke:#fff;stroke-width:1;stroke-linecap:round;opacity:calc(var(--web)*.7);transition:opacity 1s linear;pointer-events:none}
.ph,.pc{fill:none;stroke-linecap:round;opacity:0;pointer-events:none}
.ph{stroke:rgb(var(--pl));stroke-width:8}.pc{stroke:rgb(var(--pc));stroke-width:2.8}
.nh,.nc{transform-box:fill-box;transform-origin:center;pointer-events:none}
.nh{opacity:0}.n1{stop-color:rgb(var(--pl));stop-opacity:.95}.n2{stop-color:rgb(var(--pl));stop-opacity:0}
.nc{fill:rgb(var(--pc));opacity:calc(.14 + var(--v)*.3)}
.off .nc{opacity:calc(.1 + var(--v)*.15)}
.sp2{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;pointer-events:none;animation:bst .6s cubic-bezier(.2,.8,.2,1) forwards}
.tbox{margin:6px 0 10px}.tbox small{display:block;font-size:12px;opacity:.85;margin-top:8px}
.spk{position:absolute;margin:-9px;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),transparent);opacity:0;animation:twk 1.3s ease-in-out forwards}
.spk::before{content:'';position:absolute;inset:22%;background:#fff;clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%)}
@keyframes twk{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1) rotate(40deg)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
@keyframes flick{0%,100%{opacity:.3}30%{opacity:.75}55%{opacity:.4}75%{opacity:.85}}
@keyframes bst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes sheen{0%{transform:translateX(-130%)}22%,100%{transform:translateX(130%)}}
.mb svg{display:block;width:100%;height:100%;overflow:visible}
.ent .mb{position:absolute;right:92px;top:30px;width:74px;height:62px}
/* silk */
.enter>*{animation:rise .26s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*.025s)}
.hero{transition:box-shadow .6s}.hero.run{box-shadow:0 26px 70px -18px rgba(125,140,255,.9)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);transform:translateX(-130%)}
.hero.run::after{animation:sheen 14s cubic-bezier(.45,0,.2,1) infinite}
.aur i{transition:opacity 1s}body.running .aur i:nth-child(3){opacity:.45}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* colours */
/* calendar: used vs slipped */
.pb{background:repeating-linear-gradient(135deg,rgba(255,122,89,.34) 0 5px,rgba(255,122,89,.12) 5px 10px);border-left:3px solid var(--pot)}
.b{left:3px;right:0;border-radius:5px;box-shadow:0 2px 10px -3px var(--g1)}
.key b.sl{background:repeating-linear-gradient(135deg,rgba(255,122,89,.95) 0 2px,rgba(255,122,89,.35) 2px 4px)}

let lk=null;function lastCard(L){const k=L?L.f+'|'+L.p:'';if(k===lk)return;lk=k;const q=L?(L.p?Math.min(1,L.f/L.p):1):null,u=q==null?0:Math.round(q*100);$('#lastc').innerHTML=`<div><b class="flow" data-r="lp">${q==null?'–':u+'%'}</b><span>${L?'of the session’s potential used.<br><n-r data-r="lf">'+short(L.f)+'</n-r> of <n-r data-r="lt">'+short(L.p)+'</n-r> focused.':'Press Start and your last session shows up here.'}</span></div>${L?bmini(bst(q)):''}<div class="bar"><i style="width:${u}%"></i></div>`;rollAll($('#lastc'))}

{const up=tp?Math.min(100,tf/tp*100):0,w=tp?[up,100,100-up]:[0,0,0];['#tF','#tP','#tL'].forEach((q,i)=>$(q).parentNode.style.setProperty('--w',w[i]+'%'))}
{const z=bst(r?Math.round(rate()*100)/100:null),b=$('#brain');if(b._zk!==z.q){b._zk=z.q;bset(b,z)}b.className='brainw'+(r?(r.br?' brk':r.cur?' run':' off'):'')+(r&&r.cur&&z.q>=.9?' peak':'')+(r&&!r.br?' st-'+sk(z.q):'');netSet(!!(r&&r.cur),r?z.q:0);if(r&&!r.cur&&!r.br&&z.x>.25&&!RM&&rnd()<z.x*.45)flick()}$('.hero').classList.toggle('run',!!(r&&r.cur));$('.hero').classList.toggle('brk',!!(r&&r.br));document.body.classList.toggle('running',!!(r&&r.cur));

function cal(){bldT.week=performance.now();const ws=nd===7?wkStart(sel):sel,n=Date.now(),b=$('#cb'),old=b.firstChild?b.scrollTop:null,st=stepOf(),sb=subOf(st),
bg2=`linear-gradient(rgba(128,138,160,.34) 1px,transparent 1px) 0 0/100% ${st*H/60}px,linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% ${(sb||st)*H/60}px`;

let tf=0,tp=0;for(let i=0;i<nd;i++){const d0=dayAdd(ws,i);tf+=focusDay(d0);tp+=potDay(d0)}const uu=tp?Math.round(tf/tp*100):0;
$('#cs').innerHTML=`<div class="card"><div class="r"><b style="color:${uc(uu)}" data-r="wp">${tp?uu+'%':'–'}</b><span>used of potential · <n-r data-r="wf">${short(tf)}</n-r> of <n-r data-r="wt">${short(tp)}</n-r>.</span></div><div class="bar"><i style="width:${uu}%"></i></div></div>`;rollAll($('#cs'))}

function log(){bldT.log=performance.now();const d0=sel,d1=dayAdd(d0,1),f=focusDay(d0),p=potDay(d0),u=p?Math.round(f/p*100):0,n=Date.now(),r=S.run;
